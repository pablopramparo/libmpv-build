name: libmpv (LGPL, x86_64)

# Our own build of libmpv-2.dll for Auren and Kyriot. LGPL-only (-Dgpl=false), see
# compile-lgpl-libmpv.patch. Every run archives the exact source of every dependency that
# went into the binary (sources.tar.zst + MANIFEST.txt) so the LGPL source offer never depends
# on a third party's releases.

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a GitHub release with the binary and the corresponding source"
        type: boolean
        default: false
      variant:
        description: "full = every codec (Auren); audio = music only, no video or hardware decoders (Kyriot)"
        type: choice
        options:
          - full
          - audio
        default: full

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    container:
      image: ghcr.io/archlinux/archlinux:base-devel
    steps:
      - name: Install dependencies
        run: |
          echo -e "[multilib]\nInclude = /etc/pacman.d/mirrorlist" >> /etc/pacman.conf
          pacman-key --init && pacman-key --populate archlinux
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed git ninja cmake meson clang lld libc++ unzip ragel yasm nasm gperf rst2pdf lib32-gcc-libs lib32-glib2 python-cairo curl wget mimalloc ccache python-pip 7zip shaderc zstd sudo
          python -m pip install --break-system-packages roman
          git config --global user.name "ci"
          git config --global user.email "ci@users.noreply.github.com"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: libmpv-ccache-${{ github.run_id }}
          restore-keys: |
            libmpv-ccache-
      - name: Build
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
          CCACHE_MAXSIZE: 4G
          VARIANT: ${{ inputs.variant }}
        run: |
          git config --global --add safe.directory '*'
          bash ./ci-libmpv-lgpl.sh
      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: libmpv-ccache-${{ github.run_id }}
      - name: Collect logs
        if: always()
        run: 7z a logs.7z $(find build64 -type f -iname "*-*.log" -or -wholename "*/ffbuild/config.log")
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs
          path: logs.7z
      - name: Checksums
        run: sha256sum release/*.7z > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: libmpv-lgpl-binary
          path: |
            release/*.7z
            SHA256SUMS.txt
      - name: Archive corresponding source
        run: |
          df -h . || true
          {
            echo "libmpv build $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "build scripts: ${GITHUB_REPOSITORY}@${GITHUB_SHA}"
            echo
            for d in src_packages/*/; do
              if [ -e "$d/.git" ]; then
                echo "$(basename $d)  $(git -C $d remote get-url origin 2>/dev/null)  $(git -C $d rev-parse HEAD 2>/dev/null)"
              else
                echo "$(basename $d)  (no git metadata)"
              fi
            done
          } > MANIFEST.txt
          cat MANIFEST.txt
          # Source trees without .git (exact commits are in MANIFEST.txt) to keep the archive small.
          tar --exclude=.git -cf - src_packages MANIFEST.txt | zstd -10 -T0 -o sources.tar.zst
          ls -l sources.tar.zst
          sha256sum release/*.7z sources.tar.zst MANIFEST.txt > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: libmpv-lgpl-source
          path: |
            sources.tar.zst
            MANIFEST.txt
            SHA256SUMS.txt
      - name: Publish release
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prefix=libmpv
          [ "${{ inputs.variant }}" = "audio" ] && prefix=libmpv-audio
          tag="$prefix-$(date -u +%Y%m%d)-$(git -C src_packages/mpv rev-parse --short=10 HEAD)"
          gh release create "$tag" release/*.7z sources.tar.zst MANIFEST.txt SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --title "$tag" --notes "LGPL-only libmpv. sources.tar.zst is the corresponding source of every bundled dependency; MANIFEST.txt lists exact commits."
